version: "3.9"

services:

  backend:
    build: .
    container_name: civiguide-backend

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis

    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/civiguide
      REDIS_URL: redis://redis:6379

    volumes:
      - .:/app

  postgres:
    image: pgvector/pgvector:pg17

    container_name: civiguide-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: civiguide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: civiguide-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  postgres_data:
