services:
  backend:
    build: .
    container_name: civiguide-backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/civiguide
      REDIS_URL: redis://redis:6379

  postgres:
    image: pgvector/pgvector:pg17
    container_name: civiguide-postgres
    environment:
      POSTGRES_DB: civiguide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: civiguide-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: